services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailbridge
      POSTGRES_USER: mailbridge
      POSTGRES_PASSWORD: mailbridge_dev_password
    ports:
      - "5432:5432"
    volumes:
      - mailbridge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailbridge -d mailbridge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mailbridge_pgdata:
